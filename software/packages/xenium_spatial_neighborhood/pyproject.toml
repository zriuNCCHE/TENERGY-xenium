[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xenium-spatial-neighborhood"
version = "0.2.4"
description = "Spatial cellular-neighborhood analysis for Xenium-style AnnData objects using NMF."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "matplotlib",
  "seaborn",
  "statsmodels",
  "squidpy",
]

[tool.setuptools.packages.find]
where = ["src"]
