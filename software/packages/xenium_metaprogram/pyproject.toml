[project]
name = "xenium-metaprogram-analysis"
version = "0.1.0"
description = "Xenium-adapted malignant-cell meta-program analysis using multi-K NMF."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scanpy",
    "seaborn",
    "matplotlib",
    "scipy",
    "scikit-learn",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
