[project]
name = "xenium-malignant-cell-distance-analysis"
version = "0.1.0"
description = "Xenium spatial malignant-cell distance and tumor-margin annotation for AnnData."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
